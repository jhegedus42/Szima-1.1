  - paragraph [ref=e96]: "A 49 pár × 3 alternativitási törvény egyetlen Refl-lel bizonyítva. Nem asszociatív: (e₁e₂)e₃ = −e₆ ≠ e₁(e₂e₃) = +e₆."
  - paragraph [ref=e97]: "MIÉRT az AI-hez: a mondat = nem asszociatív szorzat. A csoportosítás változtatja a jelentést: „új ház festése\" = (új ház) festése ≠ új (ház festése). A szórend nem dekoráció — a jelentés hordozója. Az oktonion-algebra a nyelv szerkezetének matematikai modellje."
