  - heading "5. Zitterbewegung (a Dirac-nyelv időfejlődése)" [level=2] [ref=e105]
  - paragraph [ref=e108]: A jelentés oszcillál a térbeli (中文) és időbeli (magyar) nézet között.
  - paragraph [ref=e109]: "MIÉRT az AI-hez: a kétnyelvű gondolkodás mechanizmusa: γ⁰ (az idő = magyar toldalék!) forgatja a jelentést a térbeli (kínai, sűrű) és időbeli (magyar, dinamikus) nézet között. Ez nem fordítás egymás után — egyidejű reprezentáció, mint a hullám-részecske dualitás. A szerveri bugarról (blokk-diagonális γ⁰): a két nyelv sosem találkozik — a „gondolkodás\" lehetetlen."
