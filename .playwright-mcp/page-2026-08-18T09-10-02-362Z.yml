  - heading "2. Cayley–Dickson-torony (2→4→8→24→240)" [level=2] [ref=e13]
  - paragraph [ref=e16]: A kör 8 pontja → a gömb 24 → az oktonion-gömb 240 = az E8 gyökök.
  - paragraph [ref=e17]: "MIÉRT az AI-hez: egy gondolat = egy bájt (240+16=256). A kínai gyökér (5 bit, objektum) + magyar toldalék (3 bit, morfizmus) = 8 bit = E8Pont. A hangrend = a bájt 8. bitje = paritás-önellenőrzés. Az AI szavai nem véletlen sztringek, hanem rács-pontok."
  - paragraph [ref=e18]:
