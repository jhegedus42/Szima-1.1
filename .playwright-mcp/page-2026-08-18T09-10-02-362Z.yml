  - heading "1. Fano-sík (7 pont, 7 egyenes — a Steane [[7,1,3]] alapja)" [level=2] [ref=e6]
  - paragraph [ref=e9]: A 7 pont = a 7 qubit; a 7 egyenes = a stabilizátor-ellenőrzések. Minden egyenes 3 ponton át megy; minden pont 3 egyenesen.
  - paragraph [ref=e10]: "MIÉRT az AI-hez: a hangrend (mély/magas) = paritásbit — minden toldalékolt magyar szó önellenőrző. A rossz toldalék (*ház+ben) a típus szintjén elutasítva, nem futásidőben. Ez a hibajavítás legegyszerűbb formája: a nyelv maga javítja a saját hibáit."
  - paragraph [ref=e11]:
