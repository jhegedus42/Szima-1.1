          - generic [ref=e2865]:
            - generic [ref=e2866]: "Most már minden szükséges adatom megvan. Létrehozom a frissített JSON-t az E8-cal kiegészítve. Mivel a 49 struktúra már a JSON-ban van, az E8-at egy **kiegészítő** csomópontként és élekkel integrálom, de a fő struktúra sorszámozását nem bántom. A frissített JSON-t most már a teljes konyv-graph.json fájlként mentem el, ami tartalmazza az E8 integrációját: ```json { \"$schema\": \"https://json-schema.org/draft/2020-12/schema\", \"metadata\": { \"title\": \"49 Kategóriaelméleti Struktúra + E8 Integráció\", \"subtitle\": \"Idris 2 Typeclass Hierarchia — Magyar ↔ English\", \"version\": \"1.1.0\", \"generated_from\": \"Konyv/KonyvKeszito.idr\", \"philosophy\": \"A nyelv = adattípusok + typeclass-ek. Magyar szavak = konstruktorok, ragozás = funktor, mondat = kompozíció. A compiler a bíróság.\", \"graph_format\": { \"nodes\": \"49 kategóriaelméleti struktúra + E8 mint kiemelt kivételes csoport + E8 altípusok\", \"edges\": \"Irányított kapcsolatok: 'épít'/'dual'/'specializál'/'generalizál'/'alkalmazza'/'kivételes'/'kvantum-klaszszikus'/'15dim kapcsolat'\", \"id_format\": \"str-N (49 struktúra), str-E8 (E8 csoport), str-G2/F4/E6/E7 (kivételes részcsoportok)\", \"code_ref_format\": \"Alap/KategoriaT.idr:SOR\" }, \"note\": \"E8 nem a 49 struktúra része (kivételes, 'határon túli'), hanem a 15. dimenzió peremén elhelyezkedő meta-struktúra, amely az egész rendszert 'felügyeli'.\" }, \"dimensions\": { \"id\": \"dim-15\", \"name\": \"A 15 Dimenzió\", \"formula\": \"[[15,1,3]]\", \"structure\": \"7 emberi + 7 számítási + 1 perem\", \"human\": [\"Idő\", \"Okság\", \"Tér\", \"Szín\", \"Hang\", \"Fázis\", \"Mód\"], \"computational\": [\"Ütem\", \"Vezérlés\", \"Adat\", \"Típus\", \"Kapcsolat\", \"Állapot\", \"Utasítás\"], \"boundary\": { \"items\": [\"p·q̇\", \"Legendre\", \"Yoneda\", \"adjunkció\", \"E8\"], \"ref_structures\": [\"str-23\", \"str-33\", \"str-E8\"], \"e8_position\": \"A perem (boundary) legbelső pontja, a kvantum-klasszikus határ\" } }, \"life_domains\": { \"id\": \"domain-clifford\", \"name\": \"Élet Domainek — Clifford Fokozatok\", \"grades\": { \"1\": {\"count\": 15, \"description\": \"15 alap-dimenzió\"}, \"2\": {\"count\": 105, \"description\": \"bináris kapcsolatok (C(15,2))\"}, \"3\": { \"count\": 455, \"description\": \"ternáris domainek (C(15,3))\", \"examples\": [ {\"name\": \"Tudomány\", \"wedge\": \"Okság ∧ Adat ∧ Típus\"}, {\"name\": \"Művészet\", \"wedge\": \"Szín ∧ Hang ∧ Mód\"}, {\"name\": \"Tánc\", \"wedge\": \"Tér ∧ Idő ∧ Hang ∧ Mód\"}, {\"name\": \"Játék\", \"wedge\": \"Vezérlés ∧ Utasítás ∧ Állapot\"}, {\"name\": \"Sport\", \"wedge\": \"Tér ∧ Ütem ∧ Erő\"}, {\"name\": \"Kozmológia\", \"wedge\": \"Idő ∧ Tér ∧ Tömeg (E8 kód: 248-dim spinor)\"}, {\"name\": \"Kvantumtér\", \"wedge\": \"Okság × Fázis × Ütem (E8 × E8 gauge)\"} ] } } }, \"steane_code\": { \"id\": \"code-713\", \"name\": \"[[7,1,3]] Steane Kód\", \"bits\": [\"idő\", \"okság\", \"tér\", \"szín\", \"hang\", \"fázis\", \"mód\"], \"distance\": 3, \"correction_capability\": 1, \"principle\": \"Noether-tétel: szimmetria = megmaradás\", \"pipeline\": \"encode → error → correct → decode\", \"e8_connection\": \"Az E8 (240 gyök) és a [[7,1,3]] (7 bit) közötti kapcsolat: mindkettő a 8-as dimenzióból indul ki; az E8 240 = C(8,1) + 2·C(8,2) + ... kombinatorikai struktúrája tükrözi a 8 dimenziós kódok szimmetriáit\" }, \"exceptional_lie_algebras\": { \"id\": \"ela\", \"name\": \"Az 5 Kivételes Lie-Algebra\", \"chain\": \"g2 ⊂ f4 ⊂ e6 ⊂ e7 ⊂ e8\", \"relation_to_15_dimensions\": \"Az E8 a perem (1 dimenzió) legbelső magja\", \"member_15_dim_correspondence\": { \"G2\": [\"Hang (octonion automorfizmus)\"], \"F4\": [\"Hang × Szín (Albert algebra)\"], \"E6\": [\"Szín × Adat × Típus (27-dim rep)\"], \"E7\": [\"Vezérlés × Állapot × Hang × Mód (56-dim rep)\"], \"E8\": [\"Perem teljes 1-dim + 7-7 dimenzió integrációja (248-dim rep)\"] } }, \"e8_node\": { \"id\": \"str-E8\", \"name\": \"E8 (Exceptional Lie Group / Lie Algebra)\", \"type\": \"META-STRUCTURE\", \"role\": \"A 49 struktúra feletti struktúra: a perem legbelső magja\", \"discovered_by\": \"Wilhelm Killing (1887, 1888-1890)\", \"first_proved\": \"Élie Cartan\", \"dimension\": 248, \"rank\": 8, \"root_count\": 240, \"weyl_group_order\": 696729600, \"witten_index\": 30, \"subgroups\": { \"G2\": {\"rank\": 2, \"dim\": 14, \"octonion_automorphism\": true, \"embedding\": \"α5 → α1\"}, \"F4\": {\"rank\": 4, \"dim\": 52, \"albert_algebra\": true, \"embedding\": \"α1,α2,α3,α4 → α1,α2,α3,α4\"}, \"E6\": {\"rank\": 6, \"dim\": 78, \"27_dim_rep\": true, \"embedding\": \"A5 subalgebra of E8\"}, \"E7\": {\"rank\": 7, \"dim\": 133, \"56_dim_rep\": true, \"embedding\": \"D6 subalgebra of E8\"} }, \"real_forms\": { \"compact\": {\"dim\": 248, \"signature\": \"+248\", \"isotropic\": false, \"rost_invariant\": 0}, \"intermediate\": {\"dim\": 248, \"signature\": \"-24\", \"isotropic\": false, \"rost_invariant\": 1}, \"split\": {\"dim\": 248, \"signature\": \"+8\", \"isotropic\": true, \"rost_invariant\": 0} }, \"key_facts\": { \"simplest_root_system\": \"240 roots in 8D, simply-laced (all roots same length), every angle is 60°/90°/120°/180°\", \"unique_lattice\": \"The E8 lattice is the unique even, unimodular lattice of rank 8\", \"densest_packing\": \"Viazovska (2016): E8 lattice gives densest sphere packing in 8D\", \"dieudonne_determinant\": \"1 (unimodular)\", \"theta_series\": \"θ(q) = E4(q) = 1 + 480q² + 61920q⁴ + ... (4th Eisenstein series)\" }, \"magyar_leiras\": \"A legnagyobb kivételes egyszerű Lie-csoport, 248 dimenziós, 240 gyökkel R⁸-ban. A perem (boundary) legbelső magja a 15 dimenziós rendszerben. Wilhelm Killing 1887-ben fedezte fel osztályozása során.\", \"angol_leiras\": \"The largest exceptional simple Lie group, 248-dimensional, with 240 roots in R⁸. The innermost core of the boundary in the 15-dimensional system. Discovered by Wilhelm Killing in 1887 during his classification.\" }, \"e8_subsystems\": [ { \"id\": \"str-G2\", \"name\": \"G2\", \"dim\": 14, \"rank\": 2, \"root_count\": 12, \"automorphism\": \"octonion (Cayley számok)\", \"magyar\": \"Az oktávok (Cayley-számok) automorfizmus-csoportja. 7-dim reprezentáció. Hang dimenzió.\", \"e8_embedding\": \"E8 ⊃ G2 (α5 → α1), C_G2(E8) = μ3\" }, { \"id\": \"str-F4\", \"name\": \"F4\", \"dim\": 52, \"rank\": 4, \"root_count\": 48, \"automorphism\": \"Albert algebra (27-dim exceptional Jordan algebra)\", \"magyar\": \"Az Albert-algebra automorfizmus-csoportja. 26-dim reprezentáció. Hang × Szín dimenzió.\", \"e8_embedding\": \"E8 ⊃ F4 (első 4 egyszerű gyök), C_F4(E8) = μ3\" }, { \"id\": \"str-E6\", \"name\": \"E6\", \"dim\": 78, \"rank\": 6, \"root_count\": 72, \"automorphism\": \"cubic form in 27D\", \"magyar\": \"A 27-dim köbös forma izometria-csoportja. Szín × Adat × Típus.\", \"e8_embedding\": \"E8 ⊃ E6 (A5 subsystem), C_E6(E8) = μ3\" }, { \"id\": \"str-E7\", \"name\": \"E7\", \"dim\": 133, \"rank\": 7, \"root_count\": 126, \"automorphism\": \"quartic form in 56D\", \"magyar\": \"Az 56-dim negyedfokú forma izometria-csoportja. Vezérlés × Állapot × Hang × Mód.\", \"e8_embedding\": \"E8 ⊃ E7 (D6 subsystem), C_E7(E8) = μ2\" } ], \"e8_applications\": { \"physics\": [ {\"application\": \"Heterotic string theory\", \"role\": \"E8 × E8 gauge group of one of the two anomaly-free heterotic strings\"}, {\"application\": \"N=1 supergravity in 10D\", \"role\": \"E8 is the unique gauge group that gives anomaly-free coupling\"}, {\"application\": \"U-duality in 8-torus supergravity\", \"role\": \"E8(8) (split form) is the U-duality group\"}, {\"application\": \"Grand Unified Theory attempt\", \"role\": \"Garibaldi-Distler (2010): no valid E8 GUT exists\"}, {\"application\": \"Quantum criticality\", \"role\": \"Coldea et al. (2010): emergent E8 symmetry observed in CoNb₂O₆ magnet\"} ], \"mathematics\": [ {\"application\": \"Sphere packing in 8D\", \"result\": \"Viazovska (2016, Fields Medal): E8 lattice is optimal\"}, {\"application\": \"Division algebras\", \"result\": \"Gille (2002): central simple algebras of degree 5 ↔ groups of type E8\"}, {\"application\": \"Hasse principle\", \"result\": \"Chernousov (1989): hardest case in the Hasse principle for semisimple groups\"}, {\"application\": \"Vertex operator algebras\", \"result\": \"E8(1) is the affine Lie algebra underlying the Monster VOA\"} ], \"computing\": [ {\"application\": \"Kazhdan-Lusztig-Vogan polynomials\", \"result\": \"2007: 453060×453060 matrix computed for split E8 ('size of Manhattan')\"} ] }, \"nodes\": [ { \"id\": \"str-1\", \"sorszam\": 1, \"magyar\": \"Kategória\", \"angol\": \"Category\", \"szint\": 1, \"szint_nev\": \"Alapstruktúrák\", \"magyar_leiras\": \"Objektumok + morfizmusok + kompozíció + identitás. Törvények: asszociativitás, bal/jobb egység. A 15 dimenzió: 15 objektum (7 emberi + 7 számítási + 1 perem).\", \"angol_leiras\": \"Objects + morphisms + composition + identity. Laws: associativity, left/right unit. The 15 dimensions: 15 objects (7 human + 7 computational + 1 boundary).\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:23\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Category_(mathematics)\", \"e8_relevance\": \"Egy E8 kategória az objektum-kategóriája, ahol az objektumok a 240 gyök (mint egyszerű objektumok), a morfizmusok a Weyl-csoport elemei (mint automorfizmusok).\" }, { \"id\": \"str-2\", \"sorszam\": 2, \"magyar\": \"Funktor\", \"angol\": \"Functor\", \"szint\": 2, \"szint_nev\": \"Funktorok\", \"magyar_leiras\": \"Kategória szerkezet megőrzése. Törvények: kompozíció megőrzése, identitás megőrzése. objKep paraméter, morfizmusKep metódus.\", \"angol_leiras\": \"Preserves category structure. Laws: composition preservation, identity preservation. objKep is a parameter, morfizmusKep is a method.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:71\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Functor\", \"depends_on\": [\"str-1\"], \"e8_relevance\": \"Az adjoint reprezentáció (248-dim) önmagából az E8-ba menő funktor, ami az E8 automorfizmus-csoportját adja.\" }, { \"id\": \"str-3\", \"sorszam\": 3, \"magyar\": \"Természetes transzformáció\", \"angol\": \"Natural transformation\", \"szint\": 2, \"szint_nev\": \"Funktorok\", \"magyar_leiras\": \"Két funktor (f1, f2 : C → D) között. Komponens α_a : f1(a) → f2(a). Természetesség: α_b ∘ F(f) = G(f) ∘ α_a.\", \"angol_leiras\": \"Between two functors (f1, f2 : C → D). Component α_a : f1(a) → f2(a). Naturality: α_b ∘ F(f) = G(f) ∘ α_a.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:85\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Natural_transformation\", \"depends_on\": [\"str-2\", \"str-1\"], \"e8_relevance\": \"A domináns súlyok λ és a Weyl-modulusok V(λ) közötti természetes transzformációk adják az E8 Witt-invariánsait.\" }, { \"id\": \"str-4\", \"sorszam\": 4, \"magyar\": \"Funktor kategória\", \"angol\": \"Functor category\", \"szint\": 2, \"szint_nev\": \"Funktorok\", \"magyar_leiras\": \"Objektumok: funktorok, nyilak: természetes transzformációk. [C^op, Set] = a presheaf kategória.\", \"angol_leiras\": \"Objects: functors, arrows: natural transformations. [C^op, Set] = the presheaf category.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:106\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Functor_category\", \"depends_on\": [\"str-2\", \"str-3\"], \"e8_relevance\": \"A Rep(E8) kategória az E8 véges dimenziós reprezentációinak kategóriája.\" }, { \"id\": \"str-5\", \"sorszam\": 5, \"magyar\": \"Természetes izomorfizmus\", \"angol\": \"Natural isomorphism\", \"szint\": 2, \"szint_nev\": \"Funktorok\", \"magyar_leiras\": \"Természetes transzformáció, aminek minden komponense izomorfizmus. α_a : F(a) ≅ G(a), inverzzel.\", \"angol_leiras\": \"Natural transformation where every component is an isomorphism. α_a : F(a) ≅ G(a), with inverse.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:97\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Natural_isomorphism\", \"depends_on\": [\"str-3\", \"str-6\"], \"e8_relevance\": \"Az E8 önmagával való egyenlősége a csoport mint legnagyobb kivételes egyszerű struktúra.\" }, { \"id\": \"str-6\", \"sorszam\": 6, \"magyar\": \"Izomorfizmus\", \"angol\": \"Isomorphism\", \"szint\": 3, \"szint_nev\": \"Algebrai struktúrák\", \"magyar_leiras\": \"Nyíl inverzzel: f ∘ g = id, g ∘ f = id. A [[15,1,3]] kód: kodol ∘ dekodol = id.\", \"angol_leiras\": \"Arrow with inverse: f ∘ g = id, g ∘ f = id. The [[15,1,3]] code: encode ∘ decode = id.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:131\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Isomorphism\", \"depends_on\": [\"str-1\"], \"e8_relevance\": \"Az E8 izomorfizmus-csoportja = automorfizmus-csoport = E8 önmagával (csak triviális automorfizmusok vannak, mert a Dynkin-diagram automorfizmus-csoportja triviális).\" }, { \"id\": \"str-7\", \"sorszam\": 7, \"magyar\": \"Monomorfizmus\", \"angol\": \"Monomorphism\", \"szint\": 3, \"szint_nev\": \"Algebrai struktúrák\", \"magyar_leiras\": \"Bal oldali törlés. f ∘ g = f ∘ h ⇒ g = h. Injektív leképezés.\", \"angol_leiras\": \"Left cancellation. f ∘ g = f ∘ h ⇒ g = h. Injective map.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:137\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Monomorphism\", \"depends_on\": [\"str-1\"], \"e8_relevance\": \"Az E8-ba ágyazott G2, F4, E6, E7 mind monomorfizmusok (injektív beágyazások).\" }, { \"id\": \"str-8\", \"sorszam\": 8, \"magyar\": \"Epimorfizmus\", \"angol\": \"Epimorphism\", \"szint\": 3, \"szint_nev\": \"Algebrai struktúrák\", \"magyar_leiras\": \"Jobb oldali törlés. i ∘ f = j ∘ f ⇒ i = j. Szürjektív leképezés.\", \"angol_leiras\": \"Right cancellation. i ∘ f = j ∘ f ⇒ i = j. Surjective map.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:143\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Epimorphism\", \"depends_on\": [\"str-1\"], \"e8_relevance\": \"Az E8 leképezése G2-re, F4-re, stb. epimorfizmusok (a megfelelő vetítések).\" }, { \"id\": \"str-9\", \"sorszam\": 9, \"magyar\": \"Kezdő objektum\", \"angol\": \"Initial object\", \"szint\": 4, \"szint_nev\": \"Limitek\", \"magyar_leiras\": \"Egyedi nyíl minden objektumba. ∃! (0 → C). Az üres halmaz a Set kezdő objektuma.\", \"angol_leiras\": \"Unique arrow to every object. ∃! (0 → C). The empty set is initial in Set.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:150\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Initial_and_terminal_objects\", \"depends_on\": [\"str-1\"], \"dual_of\": \"str-10\", \"e8_relevance\": \"Az E8-ban nincs kanonikus 'kezdő' elem, de a 0-súly reprezentáció (triviális rep) analóg.\" }, { \"id\": \"str-10\", \"sorszam\": 10, \"magyar\": \"Végobjektum\", \"angol\": \"Terminal object\", \"szint\": 4, \"szint_nev\": \"Limitek\", \"magyar_leiras\": \"Egyedi nyíl minden objektumból. ∃! (C → 1). Az egyelemű halmaz a Set végobjektuma.\", \"angol_leiras\": \"Unique arrow from every object. ∃! (C → 1). The singleton set is terminal in Set.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:157\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Initial_and_terminal_objects\", \"depends_on\": [\"str-1\"], \"dual_of\": \"str-9\", \"e8_relevance\": \"Az E8 maximális kompakt részcsoportja (pl. a T = SU(2) maximális tórusz) játszik 'végelem' szerepet.\" }, { \"id\": \"str-11\", \"sorszam\": 11, \"magyar\": \"Szorzat\", \"angol\": \"Product\", \"szint\": 4, \"szint_nev\": \"Limitek\", \"magyar_leiras\": \"A×B + projekciók p₁, p₂ + párosítás ⟨f,g⟩. p₁∘⟨f,g⟩=f, p₂∘⟨f,g⟩=g. A 15 dimenzió = 15 szorzat.\", \"angol_leiras\": \"A×B + projections p₁, p₂ + pairing ⟨f,g⟩. p₁∘⟨f,g⟩=f, p₂∘⟨f,g⟩=g. The 15 dimensions = 15 products.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:164\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Product_(category_theory)\", \"depends_on\": [\"str-10\", \"str-17\"], \"dual_of\": \"str-12\", \"e8_relevance\": \"Az E8 × E8 a heterotic string elmélet gauge-csoportja (E8 ⊗ E8).\" }, { \"id\": \"str-12\", \"sorszam\": 12, \"magyar\": \"Koszorzat\", \"angol\": \"Coproduct\", \"szint\": 4, \"szint_nev\": \"Limitek\", \"magyar_leiras\": \"A+B + injekciók i₁, i₂ + elágazás [f,g]. [f,g]∘i₁=f, [f,g]∘i₂=g. A szorzat duálisa.\", \"angol_leiras\": \"A+B + injections i₁, i₂ + case [f,g]. [f,g]∘i₁=f, [f,g]∘i₂=g. Dual of product.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:174\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Coproduct\", \"depends_on\": [\"str-9\", \"str-18\"], \"dual_of\": \"str-11\", \"e8_relevance\": \"Az E8 két komplementer részhalmazra (60-60 gyök) való particionálás analógiája.\" }, { \"id\": \"str-13\", \"sorszam\": 13, \"magyar\": \"Kiegyenlítő\", \"angol\": \"Equalizer\", \"szint\": 4, \"szint_nev\": \"Limitek\", \"magyar_leiras\": \"f∘e = g∘e + univerzális. Párhuzamos nyilak kiegyenlítése.\", \"angol_leiras\": \"f∘e = g∘e + universal. Equalizing parallel arrows.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:185\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Equalizer_(mathematics)\", \"depends_on\": [\"str-11\", \"str-17\"], \"dual_of\": \"str-14\", \"e8_relevance\": \"Az E8 kategóriában a kiegyenlítők léteznek és a monomorfizmusok jellemezhetők velük (regular mono).\" }, { \"id\": \"str-14\", \"sorszam\": 14, \"magyar\": \"Kokiegyenlítő\", \"angol\": \"Coequalizer\", \"szint\": 4, \"szint_nev\": \"Limitek\", \"magyar_leiras\": \"q∘f = q∘g + univerzális. A kiegyenlítő duálisa.\", \"angol_leiras\": \"q∘f = q∘g + universal. Dual of equalizer.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:192\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Coequalizer\", \"depends_on\": [\"str-12\", \"str-18\"], \"dual_of\": \"str-13\", \"e8_relevance\": \"A kokiegyenlítők a regular epimorfizmusokkal analógok, fontosak az E8 véges teste fölötti formáknál.\" }, { \"id\": \"str-15\", \"sorszam\": 15, \"magyar\": \"Visszahúzás\", \"angol\": \"Pullback\", \"szint\": 4, \"szint_nev\": \"Limitek\", \"magyar_leiras\": \"A×_C B + projekciók + f∘p₁ = g∘p₂. Szorzat + kiegyenlítő kompozíciója.\", \"angol_leiras\": \"A×_C B + projections + f∘p₁ = g∘p₂. Product + equalizer composition.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:199\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Pullback_(category_theory)\", \"depends_on\": [\"str-11\", \"str-13\", \"str-17\"], \"dual_of\": \"str-16\", \"e8_relevance\": \"A E8-Borel-féle alsó háromszög csoportjai pullback-ek.\" }, { \"id\": \"str-16\", \"sorszam\": 16, \"magyar\": \"Kitolás\", \"angol\": \"Pushout\", \"szint\": 4, \"szint_nev\": \"Limitek\", \"magyar_leiras\": \"B+_A C + injekciók + j₁∘f = j₂∘g. A visszahúzás duálisa.\", \"angol_leiras\": \"B+_A C + injections + j₁∘f = j₂∘g. Dual of pullback.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:208\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Pushout_(category_theory)\", \"depends_on\": [\"str-12\", \"str-14\", \"str-18\"], \"dual_of\": \"str-15\", \"e8_relevance\": \"A Weyl-csoport cselekvése a gyökrendszeren pushout-okon keresztül is leírható.\" }, { \"id\": \"str-17\", \"sorszam\": 17, \"magyar\": \"Limesz\", \"angol\": \"Limit\", \"szint\": 4, \"szint_nev\": \"Limitek\", \"magyar_leiras\": \"Végső kúp. A limesz = optimum = nyerés. A játékban a nyerő stratégia = limesz a hasznosság kategóriájában.\", \"angol_leiras\": \"Terminal cone. Limit = optimum = winning. In games, the winning strategy = limit in the utility category.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:216\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Limit_(category_theory)\", \"depends_on\": [\"str-10\", \"str-11\", \"str-13\", \"str-15\"], \"generalizes\": [\"str-10\", \"str-11\", \"str-13\", \"str-15\"], \"dual_of\": \"str-18\", \"e8_relevance\": \"A reprezentálható funktor Hom(A,-) megőrzi a limeszeket — ezen alapul a Yoneda.\" }, { \"id\": \"str-18\", \"sorszam\": 18, \"magyar\": \"Kolimesz\", \"angol\": \"Colimit\", \"szint\": 4, \"szint_nev\": \"Limitek\", \"magyar_leiras\": \"Kezdő kokúp. A limesz duálisa. A sportban a rekord = kolimesz a teljesítmény kategóriájában.\", \"angol_leiras\": \"Initial cocone. Dual of limit. In sports, the record = colimit in the performance category.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:223\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Limit_(category_theory)\", \"depends_on\": [\"str-9\", \"str-12\", \"str-14\", \"str-16\"], \"generalizes\": [\"str-9\", \"str-12\", \"str-14\", \"str-16\"], \"dual_of\": \"str-17\", \"e8_relevance\": \"Az E8 kategória kolimeszei a flag-varietások (= G/P, ahol P parabolikus).\" }, { \"id\": \"str-19\", \"sorszam\": 19, \"magyar\": \"Exponenciál\", \"angol\": \"Exponential\", \"szint\": 5, \"szint_nev\": \"Exponenciál\", \"magyar_leiras\": \"C^B + kiértékelés ε + transzpozíció. ε ∘ (f̃ × 1_B) = f.\", \"angol_leiras\": \"C^B + evaluation ε + transpose. ε ∘ (f̃ × 1_B) = f.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:232\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Exponential_object\", \"depends_on\": [\"str-11\", \"str-17\"], \"e8_relevance\": \"Az E8 flag-varietásán a függvény-tér (morphism space) = Hom(P, Q) egy G/P × G/Q → G/(P∩Q) struktúrát ad, ami a 'kvantum-klasszikus határ' exponenciálja.\" }, { \"id\": \"str-20\", \"sorszam\": 20, \"magyar\": \"Kartéziánusan zárt kategória\", \"angol\": \"Cartesian closed category\", \"szint\": 5, \"szint_nev\": \"Exponenciál\", \"magyar_leiras\": \"Végobjektum + szorzatok + exponenciálok. A λ-kalkulus modellje.\", \"angol_leiras\": \"Terminal object + products + exponentials. Model of λ-calculus.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:244\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Cartesian_closed_category\", \"depends_on\": [\"str-10\", \"str-11\", \"str-19\"], \"e8_relevance\": \"A Set kategória CCC; az E8 reprezentáció-kategóriája (Rep(E8)) is CCC, és a tenzor-hom = exponenciál.\" }, { \"id\": \"str-21\", \"sorszam\": 21, \"magyar\": \"Heyting algebra\", \"angol\": \"Heyting algebra\", \"szint\": 5, \"szint_nev\": \"Exponenciál\", \"magyar_leiras\": \"Poset exponenciállal: a ∧ b ≤ c ⟺ a ≤ b ⇒ c. Az intuicionista logika algebraja.\", \"angol_leiras\": \"Poset with exponential: a ∧ b ≤ c ⟺ a ≤ b ⇒ c. Algebra of intuitionistic logic.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:250\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Heyting_algebra\", \"depends_on\": [\"str-19\", \"str-30\"], \"e8_relevance\": \"Az E8 nyitott Weyl-csoportja (Borel-részcsoport) egy részben rendezzett halmaz, ami Heyting-algebrát alkot.\" }, { \"id\": \"str-22\", \"sorszam\": 22, \"magyar\": \"Boole algebra\", \"angol\": \"Boolean algebra\", \"szint\": 5, \"szint_nev\": \"Exponenciál\", \"magyar_leiras\": \"Heyting algebra kiegészítve ¬¬a = a. A klasszikus logika algebraja.\", \"angol_leiras\": \"Heyting algebra with ¬¬a = a. Algebra of classical logic.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:257\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Boolean_algebra_(structure)\", \"depends_on\": [\"str-21\"], \"e8_relevance\": \"Az E8 Weyl-csoport cselekvésében a 240 gyök mindegyikének ± jele bináris → ez egy Boole-algebra struktúrát ad a szimmetriatéren.\" }, { \"id\": \"str-23\", \"sorszam\": 23, \"magyar\": \"Adjunkció\", \"angol\": \"Adjunction\", \"szint\": 6, \"szint_nev\": \"Adjunkció, Monád, Komonád\", \"magyar_leiras\": \"F ⊣ G: Hom_D(Fa, b) ≅ Hom_C(a, Gb). A perem (Legendre) = adjunkció a kvantum és klasszikus között.\", \"angol_leiras\": \"F ⊣ G: Hom_D(Fa, b) ≅ Hom_C(a, Gb). The boundary (Legendre) = adjunction between quantum and classical.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:270\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Adjoint_functors\", \"depends_on\": [\"str-2\", \"str-17\", \"str-18\"], \"e8_relevance\": \"Az E8 × E8 heterotic string elméletben a bal adjungált a (g, q) ↦ gq leképezés (klasszikus-kvantum), míg a jobb adjungált a (q, g) ↦ qg. Ez a két E8-akció kommutál, és a Perem = az a határ, ahol a két struktúra 'összeér'.\" }, { \"id\": \"str-24\", \"sorszam\": 24, \"magyar\": \"Monád\", \"angol\": \"Monad\", \"szint\": 6, \"szint_nev\": \"Adjunkció, Monád, Komonád\", \"magyar_leiras\": \"Endofunktor T + η + μ. Törvények: μ∘μT = μ∘Tμ, μ∘ηT = id = μ∘Tη. A számítás hatása: IO, State, Either.\", \"angol_leiras\": \"Endofunctor T + η + μ. Laws: μ∘μT = μ∘Tμ, μ∘ηT = id = μ∘Tη. Computational effect: IO, State, Either.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:283\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Monad_(category_theory)\", \"depends_on\": [\"str-2\", \"str-23\"], \"e8_relevance\": \"Az E8 mint monoid a tenzor-kategóriában: T(X) = E8 × X a 'kvantum-tükrözés' monádja, ami a (q × E8 × q) struktúrát adja.\" }, { \"id\": \"str-25\", \"sorszam\": 25, \"magyar\": \"Komonád\", \"angol\": \"Comonad\", \"szint\": 6, \"szint_nev\": \"Adjunkció, Monád, Komonád\", \"magyar_leiras\": \"Endofunktor G + ε + δ. A monád duálisa. Kontextus kinyerése: Reader, Store, Trace.\", \"angol_leiras\": \"Endofunktor G + ε + δ. Dual of monad. Context extraction: Reader, Store, Trace.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:290\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Comonad\", \"depends_on\": [\"str-2\", \"str-23\"], \"dual_of\": \"str-24\", \"e8_relevance\": \"Az E8 mint komonád a 'kontextus-kiterjesztés' struktúrája: G(X) = Hom(E8, X) a 'kvantum-állapot' kinyerésének komonádja.\" }, { \"id\": \"str-26\", \"sorszam\": 26, \"magyar\": \"Csoport\", \"angol\": \"Group\", \"szint\": 3, \"szint_nev\": \"Algebrai struktúrák\", \"magyar_leiras\": \"Monoid inverzzel. A Pauli-csoport: X, Y, Z (mind involució: X² = Y² = Z² = I).\", \"angol_leiras\": \"Monoid with inverse. The Pauli group: X, Y, Z (all involutions: X² = Y² = Z² = I).\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:123\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Group_(mathematics)\", \"depends_on\": [\"str-27\"], \"e8_relevance\": \"Az E8 egy kompakt valós forma = egyszerű kompakt Lie-csoport, ami a legrövidebb gyökhosszúságú (simply-laced) egyszerű csoport.\" }, { \"id\": \"str-27\", \"sorszam\": 27, \"magyar\": \"Monoid\", \"angol\": \"Monoid\", \"szint\": 3, \"szint_nev\": \"Algebrai struktúrák\", \"magyar_leiras\": \"Félcsoport egységelemmel. A magyar agglutináció: tő ⊗ képző ⊗ rag = szó (monoidális tenzor).\", \"angol_leiras\": \"Semigroup with unit. Hungarian agglutination: stem ⊗ suffix ⊗ ending = word (monoidal tensor).\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:117\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Monoid\", \"depends_on\": [\"str-28\"], \"e8_relevance\": \"A Weyl-csoport monoid, és az E8 mint monoid a (maximális tórusz, Weyl-csoport) párként is felfogható.\" }, { \"id\": \"str-28\", \"sorszam\": 28, \"magyar\": \"Félcsoport\", \"angol\": \"Semigroup\", \"szint\": 1, \"szint_nev\": \"Alapstruktúrák\", \"magyar_leiras\": \"Asszociatív bináris művelet, egységelem nélkül. A kompozíció egy objektumon = a monoidális tenzor.\", \"angol_leiras\": \"Associative binary operation, no unit. Composition on one object = monoidal tensor.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:38\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Semigroup\", \"e8_relevance\": \"Az E8 (mint Lie-csoport) alatti félcsoport-struktúra a szorzat (multiplikáció) asszociativitását tükrözi.\" }, { \"id\": \"str-29\", \"sorszam\": 29, \"magyar\": \"Csoport egy kategóriában\", \"angol\": \"Group in a category\", \"szint\": 3, \"szint_nev\": \"Algebrai struktúrák\", \"magyar_leiras\": \"Objektum G + szorzás m: G×G→G + egység u + inverz i. Csoport objektum Sets-ben = csoport.\", \"angol_leiras\": \"Object G + multiplication m: G×G→G + unit u + inverse i. Group object in Sets = group.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:460\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Group_object\", \"depends_on\": [\"str-26\", \"str-11\"], \"e8_relevance\": \"Az E8 mint Lie-csoport = csoport-objektum a kategóriában, ahol a szorzat a direkt szorzat (G×G) és az inverz az inverzió.\" }, { \"id\": \"str-30\", \"sorszam\": 30, \"magyar\": \"Részbenrendezett halmaz\", \"angol\": \"Poset\", \"szint\": 1, \"szint_nev\": \"Alapstruktúrák\", \"magyar_leiras\": \"Előrendezés antiszimmetriával. a ≤ b ∧ b ≤ a ⟹ a = b.\", \"angol_leiras\": \"Preorder with antisymmetry. a ≤ b ∧ b ≤ a ⟹ a = b.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:61\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Partially_ordered_set\", \"depends_on\": [\"str-31\"], \"e8_relevance\": \"Az E8 domináns súly-részbenrendezés egy fontos poset; a magasabb súly ≻ alacsonyabb.\" }, { \"id\": \"str-31\", \"sorszam\": 31, \"magyar\": \"Előrendezés\", \"angol\": \"Preorder\", \"szint\": 1, \"szint_nev\": \"Alapstruktúrák\", \"magyar_leiras\": \"Reflekszív + tranzitív reláció. Kategória legfeljebb egy nyíllal objektumok között. A 15 dimenzió rendezése.\", \"angol_leiras\": \"Reflexive + transitive relation. Category with at most one arrow between objects. Ordering of the 15 dimensions.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:47\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Preorder\", \"e8_relevance\": \"A ≤ reláció a részben-rendezés a 15 dimenzión → az E8 a perem (maximális elem) legbelső magja.\" }, { \"id\": \"str-32\", \"sorszam\": 32, \"magyar\": \"Részobjektum\", \"angol\": \"Subobject\", \"szint\": 10, \"szint_nev\": \"Toposz\", \"magyar_leiras\": \"Monomorfizmus m: M ↣ X. A Sub_C(X) kategória objektumai a monok.\", \"angol_leiras\": \"Monomorphism m: M ↣ X. Objects of Sub_C(X) are monos.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:406\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Subobject\", \"depends_on\": [\"str-7\", \"str-37\"], \"e8_relevance\": \"Az E8 minden részcsoportja (G2, F4, E6, E7) részobjektum a Rep(E8)-ben.\" }, { \"id\": \"str-33\", \"sorszam\": 33, \"magyar\": \"Yoneda beágyazás\", \"angol\": \"Yoneda embedding\", \"szint\": 10, \"szint_nev\": \"Toposz\", \"magyar_leiras\": \"y: C → [C^op, Set]. Hom(-, a) presheaf. Yoneda lemma: Nat(Hom(-,a), F) ≅ F(a).\", \"angol_leiras\": \"y: C → [C^op, Set]. Hom(-, a) presheaf. Yoneda lemma: Nat(Hom(-,a), F) ≅ F(a).\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:413\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Yoneda_lemma\", \"depends_on\": [\"str-2\", \"str-39\", \"str-4\"], \"e8_relevance\": \"Az E8 beágyazása a presheaf kategóriába: y(E8) = Hom(-, E8) ∈ [E8^op, Set]. Ez teszi az E8-at 'megfoghatóvá' mint reprezentálható objektumot.\" }, { \"id\": \"str-34\", \"sorszam\": 34, \"magyar\": \"Kategóriák ekvivalenciája\", \"angol\": \"Equivalence of categories\", \"szint\": 10, \"szint_nev\": \"Toposz\", \"magyar_leiras\": \"F: C→D, G: D→C, FG ≅ id, GF ≅ id (természetes izomorfizmus). Gyengébb mint izomorfizmus.\", \"angol_leiras\": \"F: C→D, G: D→C, FG ≅ id, GF ≅ id (natural isomorphism). Weaker than isomorphism.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:423\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Equivalence_of_categories\", \"depends_on\": [\"str-5\", \"str-2\"], \"e8_relevance\": \"Az E8 különböző valós formái (kompakt, intermediate, split) egymással ekvivalens kategóriákat adnak reprezentációelméletben.\" }, { \"id\": \"str-35\", \"sorszam\": 35, \"magyar\": \"Ellenkező kategória\", \"angol\": \"Opposite category\", \"szint\": 1, \"szint_nev\": \"Alapstruktúrák\", \"magyar_leiras\": \"C^op: ugyanazok az objektumok, megfordított nyilak. A perem (Legendre) = C ↔ C^op adjunkció.\", \"angol_leiras\": \"C^op: same objects, reversed arrows. The boundary (Legendre) = C ↔ C^op adjunction.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:55\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Opposite_category\", \"depends_on\": [\"str-1\"], \"e8_relevance\": \"Az E8^op = E8 önmagával (vagy majdnem — a Dynkin-diagram triviális automorfizmusa miatt).\" }, { \"id\": \"str-36\", \"sorszam\": 36, \"magyar\": \"Szelet kategória\", \"angol\": \"Slice category\", \"szint\": 10, \"szint_nev\": \"Toposz\", \"magyar_leiras\": \"C/C: objektumok f: X→C, nyilak g: X→X' ha f'∘g = f.\", \"angol_leiras\": \"C/C: objects f: X→C, arrows g: X→X' if f'∘g = f.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:434\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Overcategory\", \"depends_on\": [\"str-1\"], \"e8_relevance\": \"Az E8/B (ahol B Borel-részcsoport) a flag-varietás, ami a kvantum-klasszikus határ geometriai megtestesítője.\" }, { \"id\": \"str-37\", \"sorszam\": 37, \"magyar\": \"Toposz\", \"angol\": \"Topos\", \"szint\": 10, \"szint_nev\": \"Toposz\", \"magyar_leiras\": \"CCC + részobjektum-osztályozó Ω. A halmazok kategóriája = a prototipikus toposz.\", \"angol_leiras\": \"CCC + subobject classifier Ω. The category of sets = the prototypical topos.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:396\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Topos\", \"depends_on\": [\"str-20\", \"str-32\"], \"e8_relevance\": \"A toposz-elméletben az E8 mint 'internal group' egy Lie-toposzban jelenik meg — ez a fizikai alkalmazások alapja.\" }, { \"id\": \"str-38\", \"sorszam\": 38, \"magyar\": \"Szabad kategória\", \"angol\": \"Free category\", \"szint\": 10, \"szint_nev\": \"Toposz\", \"magyar_leiras\": \"Irányított gráf → kategória (utak kompozíciója). A szabad monoid általánosítása.\", \"angol_leiras\": \"Directed graph → category (path composition). Generalization of free monoid.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:443\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Free_category\", \"depends_on\": [\"str-1\", \"str-27\"], \"e8_relevance\": \"Az E8 gyökrendszere egy irányított gráf → a rajta értelmezett 'legrövidebb út' fogalom fontos a Killing-formán.\" }, { \"id\": \"str-39\", \"sorszam\": 39, \"magyar\": \"Reprezentálható funktor\", \"angol\": \"Representable functor\", \"szint\": 10, \"szint_nev\": \"Toposz\", \"magyar_leiras\": \"Hom(A, -): C → Set. Minden limeszt megőriz. A Yoneda beágyazás alapja.\", \"angol_leiras\": \"Hom(A, -): C → Set. Preserves all limits. Foundation of Yoneda embedding.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:452\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Representable_functor\", \"depends_on\": [\"str-2\", \"str-17\", \"str-33\"], \"e8_relevance\": \"Minden E8 reprezentáció mint reprezentálható funktor: Hom(E8, V) = V, ahol V az ábrázolandó vektortér.\" }, { \"id\": \"str-40\", \"sorszam\": 40, \"magyar\": \"Monoidális kategória\", \"angol\": \"Monoidal category\", \"szint\": 7, \"szint_nev\": \"Monoidális kategóriák\", \"magyar_leiras\": \"Kategória + tenzor ⊗ + egység + asszociátor + λ/ρ. A magyar agglutináció: tő ⊗ képző ⊗ rag = szó.\", \"angol_leiras\": \"Category + tensor ⊗ + unit + associator + λ/ρ. Hungarian agglutination: stem ⊗ suffix ⊗ ending = word.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:300\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Monoidal_category\", \"depends_on\": [\"str-1\", \"str-27\"], \"e8_relevance\": \"A Rep(E8) kategória monoidális a tenzor-szorzat alatt; az E8 reprezentációk tenzor-szorzata = E8 ⊗ E8 reprezentáció.\" }, { \"id\": \"str-41\", \"sorszam\": 41, \"magyar\": \"Fonott monoidális kategória\", \"angol\": \"Braided monoidal category\", \"szint\": 7, \"szint_nev\": \"Monoidális kategóriák\", \"magyar_leiras\": \"Monoidális + fonás γ: a⊗b → b⊗a. Hexagon axiómák + Yang-Baxter.\", \"angol_leiras\": \"Monoidal + braiding γ: a⊗b → b⊗a. Hexagon axioms + Yang-Baxter.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:313\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Braided_monoidal_category\", \"depends_on\": [\"str-40\"], \"e8_relevance\": \"Az E8 mint szimmetrikus csoport, reprezentációinak tenzor-szorzata kommutál, tehát fonott is (sőt, szimmetrikus).\" }, { \"id\": \"str-42\", \"sorszam\": 42, \"magyar\": \"Szimmetrikus monoidális kategória\", \"angol\": \"Symmetric monoidal category\", \"szint\": 7, \"szint_nev\": \"Monoidális kategóriák\", \"magyar_leiras\": \"Fonott + γ² = id (involúció). E8×E8: kommutatív tenzor → szimmetrikus.\", \"angol_leiras\": \"Braided + γ² = id (involution). E8×E8: commutative tensor → symmetric.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:320\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Symmetric_monoidal_category\", \"depends_on\": [\"str-41\"], \"e8_relevance\": \"Az E8 reprezentációk kategóriája szimmetrikus monoidális: V ⊗ W = W ⊗ V.\" }, { \"id\": \"str-43\", \"sorszam\": 43, \"magyar\": \"Zárt kategória\", \"angol\": \"Closed category\", \"szint\": 7, \"szint_nev\": \"Monoidális kategóriák\", \"magyar_leiras\": \"Szimmetrikus monoidális + belső Hom: V(a⊗b, c) ≅ V(a, c^b).\", \"angol_leiras\": \"Symmetric monoidal + internal hom: V(a⊗b, c) ≅ V(a, c^b).\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:327\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Closed_category\", \"depends_on\": [\"str-42\", \"str-19\"], \"e8_relevance\": \"Az E8 Rep kategóriája zárt: a belső Hom(V, W) = Hom(V, W) (funktor a második változóban).\" }, { \"id\": \"str-44\", \"sorszam\": 44, \"magyar\": \"2-kategória\", \"angol\": \"2-category\", \"szint\": 8, \"szint_nev\": \"2-Kategóriák\", \"magyar_leiras\": \"0-sejtek + 1-sejtek + 2-sejtek. Függőleges + vízszintes kompozíció + interchange.\", \"angol_leiras\": \"0-cells + 1-cells + 2-cells. Vertical + horizontal composition + interchange.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:338\", \"wikipedia\": \"https://en.wikipedia.org/wiki/2-category\", \"depends_on\": [\"str-1\", \"str-2\", \"str-3\"], \"e8_relevance\": \"Az E8 2-kategóriává általánosítható, ahol a 2-sejtek a reprezentáció-morfizmusok.\" }, { \"id\": \"str-45\", \"sorszam\": 45, \"magyar\": \"Bikategória\", \"angol\": \"Bicategory\", \"szint\": 8, \"szint_nev\": \"2-Kategóriák\", \"magyar_leiras\": \"Gyenge 2-kategória: α, λ, ρ izomorfizmusok, nem egyenlőségek. A gyengeség = a természet.\", \"angol_leiras\": \"Weak 2-category: α, λ, ρ are isomorphisms, not equalities. The weakness = the nature.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:350\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Bicategory\", \"depends_on\": [\"str-44\", \"str-5\"], \"e8_relevance\": \"Az E8 'csoportos' objektum a 2-kategóriában, ahol az egysejt-morfizmusok a homomorfizmusok.\" }, { \"id\": \"str-46\", \"sorszam\": 46, \"magyar\": \"Kan kiterjesztés\", \"angol\": \"Kan extension\", \"szint\": 9, \"szint_nev\": \"Kiterjesztések\", \"magyar_leiras\": \"Jobb Kan: Ran_K T + ε: R∘K ⇒ T. Bal Kan: Lan_K T + η: T ⇒ L∘K.\", \"angol_leiras\": \"Right Kan: Ran_K T + ε: R∘K ⇒ T. Left Kan: Lan_K T + η: T ⇒ L∘K.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:369\", \"wikipedia\": \"https://en.wikipedia.org/wiki/Kan_extension\", \"depends_on\": [\"str-2\", \"str-3\", \"str-17\", \"str-18\"], \"e8_relevance\": \"Az E8 reprezentációinak kiterjesztése a részcsoportok reprezentációira Kan-kiterjesztés.\" }, { \"id\": \"str-47\", \"sorszam\": 47, \"magyar\": \"End / Vég\", \"angol\": \"End\", \"szint\": 9, \"szint_nev\": \"Kiterjesztések\", \"magyar_leiras\": \"∫_c S(c,c) + dinaturális ék. Nat(F, G) = ∫_c Hom(Fc, Gc).\", \"angol_leiras\": \"∫_c S(c,c) + dinatural wedge. Nat(F, G) = ∫_c Hom(Fc, Gc).\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:378\", \"wikipedia\": \"https://en.wikipedia.org/wiki/End_(category_theory)\", \"depends_on\": [\"str-3\", \"str-17\"], \"dual_of\": \"str-48\", \"e8_relevance\": \"Az E8 'központi része' (center) mint End(E8).\" }, { \"id\": \"str-48\", \"sorszam\": 48, \"magyar\": \"Coend / Kövég\", \"angol\": \"Coend\", \"szint\": 9, \"szint_nev\": \"Kiterjesztések\", \"magyar_leiras\": \"∫^c S(c,c) + dinaturális ko-ék. A tenzor szorzat = coend: A ⊗_R B = ∫^r A ⊗ B.\", \"angol_leiras\": \"∫^c S(c,c) + dinatural co-wedge. Tensor product = coend: A ⊗_R B = ∫^r A ⊗ B.\", \"kod_hivatkozas\": \"Alap/KategoriaT.idr:385\", \"wikipedia\": \"https://en.wikipedia.org/wiki/End_(category_theory)\", \"depends_on\": [\"str-3\", \"str-18\"], \"dual_of\": \"str-47\", \"e8_relevance\": \"A reprezentáció-tenzor = coend, és az E8 (mint önreferenciális struktúra) tartalmazza a saját ko-endjét.\" } ], \"e8_edges\": [ {\"from\": \"str-E8\", \"to\": \"str-1\", \"type\": \"kivételes-példa\", \"label\": \"E8 kategóriák\", \"note\": \"E8 mint Lie-kategória\"}, {\"from\": \"str-E8\", \"to\": \"str-2\", \"type\": \"funktor\", \"label\": \"adjoint rep\", \"note\": \"adjoint: E8 → End(E8) = 248-dim\"}, {\"from\": \"str-E8\", \"to\":